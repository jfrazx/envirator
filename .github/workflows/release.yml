name: Release

on:
  workflow_run:
    workflows: ['Tests']
    branches: [master]
    types:
      - completed

jobs:
  release:
    runs-on: ubuntu-latest

    # `completed` fires for failed runs too -- only release when Tests actually passed
    if: github.event.workflow_run.conclusion == 'success'

    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm run release
