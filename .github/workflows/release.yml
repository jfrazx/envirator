name: Release

on:
  workflow_run:
    workflows: ['Tests']
    branches: [master]
    types:
      - completed

permissions:
  packages: write
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest

    # workflow_run runs with repository secrets and a write token even when the
    # run that triggered it did not have them, and the checkout below is of the
    # triggering commit. The trigger-level `branches` filter above matches the
    # head branch, so it already excludes ordinary pull requests -- but a fork's
    # default branch is also named master. Hence:
    #   conclusion      -- `completed` fires for failed runs too
    #   event           -- Tests also runs on pull_request, including from forks
    #   head_repository -- and that fork's branch may well be named master
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository

    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # workflow_run checks out the default-branch tip by default, which is
          # not necessarily the commit that was tested. Pin to the tested tree.
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm run release
